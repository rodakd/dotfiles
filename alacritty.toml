[general]
import = [
    "~/.config/alacritty/themes/nord.toml"
]

[env]
TERM = "xterm-256color"

[font]
size = 15.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 10

[window]
opacity = 1.0

[window.dimensions]
columns = 180
lines = 50

[window.padding]
x = 15
y = 15

[cursor]
blink_interval = 0

[cursor.style]
shape = "Block"
blinking = "Never"

[scrolling]
history = 10000

[bell]
duration = 0
